# Production: TLS terminates in the trusted UI proxy, so backend sees HTTPS
# only from its allowlisted container IP. Certificates stay outside Git.
services:
  backend:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
  ui:
    ports: !override ["127.0.0.1:${HTTPS_PORT:-8443}:443"]
    volumes:
      - ./ui/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH}:/etc/nginx/tls/cert.pem:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH}:/etc/nginx/tls/key.pem:ro
