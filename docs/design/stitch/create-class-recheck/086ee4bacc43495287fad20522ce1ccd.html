<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#f8f9ff;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary-fixed-variant": "#763300", "primary-fixed-dim": "#b6c4ff", "surface-container": "#e6eeff", "secondary-container": "#86f2e4", "tertiary-container": "#6c2e00", "surface-container-highest": "#d5e3fd", "outline-variant": "#c5c5d3", "primary-container": "#1e3a8a", "on-tertiary-fixed": "#331200", "on-error-container": "#93000a", "secondary-fixed": "#89f5e7", "on-secondary": "#ffffff", "error-container": "#ffdad6", "on-primary": "#ffffff", "on-secondary-container": "#006f66", "tertiary-fixed-dim": "#ffb68e", "surface-container-high": "#dde9ff", "on-primary-fixed-variant": "#264191", "on-surface": "#0d1c2f", "surface-variant": "#d5e3fd", "primary": "#00236f", "on-primary-container": "#90a8ff", "tertiary-fixed": "#ffdbca", "tertiary": "#4a1d00", "surface-container-lowest": "#ffffff", "on-error": "#ffffff", "secondary-fixed-dim": "#6bd8cb", "primary-fixed": "#dce1ff", "inverse-primary": "#b6c4ff", "on-tertiary": "#ffffff", "error": "#ba1a1a", "surface": "#f8f9ff", "secondary": "#006a61", "surface-dim": "#ccdbf4", "on-tertiary-container": "#ff8e49", "on-secondary-fixed-variant": "#005049", "surface-container-low": "#eff4ff", "background": "#f8f9ff", "outline": "#757682", "surface-tint": "#4059aa", "inverse-on-surface": "#ebf1ff", "surface-bright": "#f8f9ff", "on-primary-fixed": "#00164e", "on-surface-variant": "#444651", "inverse-sur  shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Quay lại" class="w-11 h-11 -ml-2 flex items-center justify-center text-on-surface hover:text-primary transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button><h1 class="font-title-md text-title-md text-on-surface truncate">Chi Tiết Lớp Học</h1></div><div class="flex items-center gap-1.5"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div><span class="font-label-sm text-label-sm text-on-surface-variant font-bold pr-1">TN</span></div></div></header><main class="flex-1 flex flex-col w-full max-w-[390px] mx-auto px-margin-mobile pt-14 pb-safe bg-surface"><div class="flex flex-col w-full pb-8">
<!-- Academic Header & Inspiration Banner -->
<div class="flex flex-col gap-space-xs pt-space-sm pb-space-md">

<h2 class="font-headline-md text-headline-md text-on-surface">Tạo lớp mới</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Nhập thông tin cơ bản để bắt đầu quản lý hồ sơ và lịch trình giảng dạy.</p>
</div>
<!-- Visual Card: Academic Workspace Ambience -->

<!-- Form Section Card -->
<form class="flex flex-col gap-space-md bg-surface-container-lowest p-space-md rounded-xl shadow-sm" id="new-class-form" onsubmit="event.preventDefault(); handleClassSubmit();">
<!-- Class Name -->
<div class="flex flex-col">
<div class="flex items-center justify-between mb-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1" for="className">
<span class="">Tên lớp</span>
<span class="text-error font-bold">*</span>
</label>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Bắt buộc</span>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">school</span>
<input class="w-full h-12 pl-10 pr-4 bg-surface-container-low text-on-surface rounded-xl font-body-md text-body-md placeholder:text-outline transition-colors outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_rgba(0,35,111,0.25)]" id="className" name="className" placeholder="Ví dụ: Toán Nâng Cao 9A" required="" type="text">
</div>
</div>
<!-- Subject Selection / Input -->
<div class="flex flex-col">
<div class="flex items-center justify-between mb-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1" for="subjectName">
<span class="">Môn học</span>
<span class="text-error font-bold">*</span>
</label>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Gợi ý nhanh</span>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">menu_book</span>
<input class="w-full h-12 pl-10 pr-4 bg-surface-container-low text-on-surface rounded-xl font-body-md text-body-md placeholder:text-outline transition-colors outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_rgba(0,35,111,0.25)]" id="subjectName" name="subjectName" placeholder="Ví dụ: Toán học, Tiếng Anh..." required="" type="text">
</div>
<!-- Quick Subject Tags -->
<div class="flex items-center gap-1.5 mt-2 overflow-x-auto py-0.5 no-scrollbar">
<button class="px-2.5 py-1 rounded-lg bg-surface-container text-on-primary-fixed-variant font-label-sm text-label-sm whitespace-nowrap active:scale-95 transition-transform" onclick="selectSubject('Toán học')" type="button">
          Toán học
        </button>
<button class="px-2.5 py-1 rounded-lg bg-surface-container text-on-primary-fixed-variant font-label-sm text-label-sm whitespace-nowrap active:scale-95 transition-transform" onclick="selectSubject('Vật lý')" type="button">
          Vật lý
        </button>
<button class="px-2.5 py-1 rounded-lg bg-surface-container text-on-primary-fixed-variant font-label-sm text-label-sm whitespace-nowrap active:scale-95 transition-transform" onclick="selectSubject('Tiếng Anh')" type="button">
          Tiếng Anh
        </button>
<button class="px-2.5 py-1 rounded-lg bg-surface-container text-on-primary-fixed-variant font-label-sm text-label-sm whitespace-nowrap active:scale-95 transition-transform" onclick="selectSubject('Ngữ văn')" type="button">
          Ngữ văn
        </button>
</div>
</div>
<!-- Description -->
<div class="flex flex-col">
<div class="flex items-center justify-between mb-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1" for="classDesc">
<span class="">Mô tả</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-normal">(tùy chọn)</span>
</label>

</div>
<div class="relative">
<textarea class="w-full p-3.5 bg-surface-container-low text-on-surface rounded-xl font-body-md text-body-md placeholder:text-outline transition-colors outline-none resize-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_rgba(0,35,111,0.25)]" id="classDesc" maxlength="200" name="classDesc" placeholder="Ghi chú ngắn về mục tiêu khóa học, sách giáo trình hoặc yêu cầu đầu vào..." rows="3"></textarea>
</div>
</div>
<!-- Curriculum Snapshot Insight (Visual Ornamentation) -->

<!-- Feedback Message Container -->
<div class="hidden p-3 rounded-xl bg-secondary-container text-on-secondary-container font-label-md text-label-md items-center gap-2" id="statusToast">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
<span class="">Đang lưu lớp học vào danh mục...</span>
</div>
<!-- Form Action Buttons -->
<div class="flex flex-col gap-2 pt-space-xs">
<button class="w-full h-12 flex items-center justify-center gap-2 bg-primary text-on-primary font-title-md text-title-md rounded-xl shadow-md active:scale-[0.99] transition-transform" id="saveButton" type="submit">
<span class="material-symbols-outlined text-[20px]">save</span>
<span class="">Lưu lớp</span>
</button>
<button class="w-full h-12 flex items-center justify-center text-on-surface-variant hover:text-on-surface font-title-md text-title-md rounded-xl bg-surface-container-low active:bg-surface-container transition-colors" onclick="history.back()" type="button">
<span class="">Hủy</span>
</button>
</div>
</form>
<!-- Contextual Helper Section -->

</div>
<script>
  function selectSubject(val) {
    const input = document.getElementById('subjectName');
    if (input) {
      input.value = val;
      input.focus();
    }
  }

  function handleClassSubmit() {
    const className = document.getElementById('className').value.trim();
    const subjectName = document.getElementById('subjectName').value.trim();
    if (!className || !subjectName) return;

    const toast = document.getElementById('statusToast');
    const saveBtn = document.getElementById('saveButton');
    if (toast && saveBtn) {
      saveBtn.disabled = true;
      saveBtn.classList.add('opacity-75');
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      
      setTimeout(() => {
        history.back();
      }, 1000);
    }
  }
</script></main>

</body></html>
