nverse-surface": "#233144", "on-background": "#0d1c2f", "surface-container-lowest": "#ffffff" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "margin-mobile": "1rem", "space-lg": "1.5rem", "margin": "2rem", "space-xl": "2.5rem", "space-md": "1rem", "gutter-mobile": "1rem", "space-xs": "0.25rem", "gutter": "1.5rem", "space-sm": "0.5rem" }, "fontFamily": { "title-lg": ["Manrope"], "display-lg-mobile": ["Literata"], "body-sm": ["Manrope"], "label-sm": ["Manrope"], "headline-md": ["Literata"], "label-md": ["Manrope"], "headline-lg": ["Literata"], "display-lg": ["Literata"], "body-lg": ["Manrope"], "title-md": ["Manrope"], "headline-sm": ["Literata"], "body-md": ["Manrope"] }, "fontSize": { "title-lg": ["18px", { "lineHeight": "26px", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.005em", "fontWeight": "500" }], "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "600" }], "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "400" }], "title-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-margin-mobile flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0 flex-1"><button aria-label="Quay lại hoặc Đóng" class="min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl text-primary-container hover:bg-surface-container-high transition-colors -ml-space-xs" onclick="window.history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex items-center gap-space-xs min-w-0"><div class="w-7 h-7 rounded-lg bg-primary-container/10 flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-primary-container text-[18px]">menu_book</span></div><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Tao Lop Moi</h1></div></div><div class="flex items-center shrink-0 pl-space-xs"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 px-margin-mobile pb-space-xl bg-surface flex-1"><div class="flex flex-col w-full gap-space-md">
<!-- Banner cảnh báo lỗi kết nối -->
<div aria-live="assertive" class="bg-error-container text-on-error-container rounded-xl p-space-md shadow-sm flex items-start gap-space-sm" role="alert">
<div class="w-10 h-10 rounded-lg bg-on-error-container/10 flex items-center justify-center shrink-0 mt-0.5">
<span class="material-symbols-outlined text-error text-[24px]">wifi_off</span>
</div>
<div class="flex flex-col flex-1 min-w-0">
<h2 class="font-title-md text-title-md font-semibold text-on-error-container tracking-tight">Lỗi kết nối máy chủ</h2>
<p class="font-body-md text-body-md text-on-error-container/90 mt-space-xs leading-relaxed">
        Không thể lưu thông tin lớp học do gián đoạn kết nối. Vui lòng kiểm tra mạng và thử lại.
      </p>
<div class="mt-space-sm flex items-center gap-1.5 text-error font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px]">info</span>
<span>Dữ liệu vừa nhập vẫn được bảo lưu an toàn.</span>
</div>
</div>
</div>
<!-- Form điền thông tin lớp học -->
<form class="flex flex-col gap-space-md bg-surface-container-lowest p-space-lg rounded-xl shadow-sm" id="create-class-form" onsubmit="event.preventDefault(); handleRetry();">
<!-- Trường: Tên lớp học -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1" for="class-name">
<span>Tên lớp</span>
<span aria-hidden="true" class="text-error font-bold">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg px-3.5 py-3 pr-10 focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" id="class-name" name="className" placeholder="Nhập tên lớp học..." required="" type="text" value="Toán Nâng Cao 9A"/>
<div class="absolute right-3 text-secondary flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Trường: Môn học -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1" for="subject-name">
<span>Môn học</span>
<span aria-hidden="true" class="text-error font-bold">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg px-3.5 py-3 pr-10 focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" id="subject-name" name="subject" placeholder="Nhập môn học..." required="" type="text" value="Toán học"/>
<div class="absolute right-3 text-secondary flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Trường: Mô tả lớp học (Tùy chọn) -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="class-description">
          Mô tả
        </label>
<span class="font-body-sm text-body-sm text-on-surface-variant">Tùy chọn</span>
</div>
<textarea class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg p-3.5 focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all resize-none leading-relaxed" id="class-description" name="description" placeholder="Ghi chú tóm tắt về mục tiêu giảng dạy hoặc định hướng..." rows="4">Bồi dưỡng học sinh thi vào trường chuyên toán.</textarea>
</div>
<!-- Cụm nút thao tác -->
<div class="pt-space-sm flex flex-col-reverse gap-space-sm sm:flex-row sm:items-center">
<button class="w-full sm:flex-1 h-12 min-h-[44px] px-space-md rounded-xl bg-surface-container text-on-surface font-title-md text-title-md flex items-center justify-center gap-2 active:bg-surface-container-high transition-colors" onclick="window.history.back()" type="button">
<span>Hủy</span>
</button>
<button class="w-full sm:flex-1 h-12 min-h-[44px] px-space-md rounded-xl bg-primary-container text-on-primary font-title-md text-title-md shadow-md flex items-center justify-center gap-2 active:opacity-90 active:scale-[0.99] transition-all" id="btn-retry" type="submit">
<span class="material-symbols-outlined text-[20px]" id="retry-icon">refresh</span>
<span id="retry-text">Thử lại</span>
</button>
</div>
</form>
</div>
<script>
  function handleRetry() {
    const btn = document.getElementById('btn-retry');
    const icon = document.getElementById('retry-icon');
    const text = document.getElementById('retry-text');

    if (!btn || !icon || !text) return;

    btn.disabled = true;
    btn.classList.add('opacity-80', 'cursor-not-allowed');
    icon.classList.add('animate-spin');
    text.textContent = 'Đang gửi lại...';

    setTimeout(() => {
      btn.disabled = false;
      btn.classList.remove('opacity-80', 'cursor-not-allowed');
      icon.classList.remove('animate-spin');
      text.textContent = 'Thử lại';
    }, 2000);
  }
</script></main></body></html>
