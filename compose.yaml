services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: education_keeptrack
      POSTGRES_USER: education_keeptrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U education_keeptrack -d education_keeptrack"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["--migrate"]
    environment:
      ConnectionStrings__Database: Host=db;Database=education_keeptrack;Username=education_keeptrack;Password=${POSTGRES_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
  backend:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=db;Database=education_keeptrack;Username=education_keeptrack;Password=${POSTGRES_PASSWORD}
      DataProtection__KeyPath: /keys
      ReverseProxy__KnownProxy: 172.30.110.3
      Reporting__Endpoint: http://s3:8333
      Reporting__Region: us-east-1
      Reporting__Bucket: ekt-reports
      Reporting__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      Reporting__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - session-keys:/keys
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_started }
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data", "-ip=s3", "-ip.bind=0.0.0.0", "-admin.ui=false", "-webdav=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ekt-reports
    volumes: ["report-objects:/data"]
  ui:
    build: ./ui
    ports: ["127.0.0.1:${UI_PORT:-8088}:80"]
    depends_on: [backend]
    networks:
      default: { ipv4_address: 172.30.110.3 }
networks:
  default:
    ipam:
      config: [{ subnet: 172.30.110.0/24, ip_range: 172.30.110.128/25 }]
volumes:
  postgres-data:
  session-keys:
  report-objects:
